<header class="header sticky-top bg-white shadow-sm">
  <nav class="navbar navbar-expand-lg navbar-light py-3">
    <div class="container">
    
      <a class="navbar-brand d-flex align-items-center fs-3 fw-bold text-primary" routerLink="/home">
        <i class="bi bi-plus-circle-fill me-2 fs-4"></i>
        <span>WeShop</span>
      </a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNavbar">

        <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-2 gap-lg-4 text-center">
          <li class="nav-item">
            <a class="nav-link fw-medium px-lg-3" routerLink="/home" routerLinkActive="active text-primary fw-semibold" [routerLinkActiveOptions]="{exact: true}">
              <i class="bi bi-house-door me-1 d-lg-none"></i>Home
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link fw-medium px-lg-3" routerLink="/about" routerLinkActive="active text-primary fw-semibold">
              <i class="bi bi-info-circle me-1 d-lg-none"></i>About
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link fw-medium px-lg-3" routerLink="/store" routerLinkActive="active text-primary fw-semibold">
              <i class="bi bi-shop me-1 d-lg-none"></i>Store
            </a>
          </li>
        </ul>

        <div class="d-flex justify-content-center mt-3 mt-lg-0">
          <button class="btn btn-primary rounded-pill px-4 py-2 fw-semibold shadow-sm d-flex align-items-center" routerLink="/form">
            <i class="bi bi-person-fill me-2"></i>
            Se connecter
          </button>
        </div>
        
      </div>
    </div>
  </nav>
</header>


<main class="container py-5">
  <router-outlet></router-outlet>
</main>
