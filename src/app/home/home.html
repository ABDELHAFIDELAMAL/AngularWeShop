<div class="container p-5">
  <table class="table">
  <thead>
    <tr>
      <th>id</th>
      <th>name</th>
      <th>price3</th>
      <th>quantity</th>
    </tr>
  </thead>
  <tbody>
    @for(p of products ; track p){
      <tr>
        <td>{{p.id}}</td>
        <td>{{p.name}}</td>
        <td>{{p.price}}</td>
        <td>{{p.quantity}}</td>
        <td>
          <button (click) = "delete(p)">delete</button>
        </td>
      </tr>
    }
  </tbody>
</table>
</div>
